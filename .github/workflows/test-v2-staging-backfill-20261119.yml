name: Phase 7 V2 restored-staging backfill rehearsal
on:
  push:
    paths:
      - .github/workflows/test-v2-staging-backfill-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-only-on-disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: hare_v2_stage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d hare_v2_stage_ci"
          --health-interval 3s
          --health-timeout 4s
          --health-retries 20
    env:
      HARE_V2_LOCAL_STAGING: "yes"
      V2_TEST_STAGE_DSN: postgresql://tester:tester@127.0.0.1:5432/hare_v2_stage_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client library
        run: pip install 'psycopg[binary]'
      - name: Verify exact backfill on isolated PostgreSQL 17
        run: |
          cd deployment
          python -m unittest -v test_v2_staging_backfill test_v2_numeric_lossless_backfill test_v2_shadow_schema_manifest
      - name: Confirm staging tools cannot address production
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'deployment')
          from v2_staging_backfill import verify_stage_dsn
          for url in ('postgresql://db.example.org/hare_v2_stage_ci','postgresql://127.0.0.1/hare_factory'):
              try:verify_stage_dsn(url)
              except RuntimeError:pass
              else:raise AssertionError('Blocked production URL was accepted')
          print('PRODUCTION_URL_REJECTION_PASSED')
          PY
