name: Fix exact large market transactions
on:
  push:
    paths:
      - .github/workflows/market-exact-bigint-transactions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch the deployed ZIP
        run: python deployment/market-exact-bigint-transactions.py
      - name: Check Python, JS, exponent transport and DB range
        run: |
          mkdir -p /tmp/hare-big-market/static
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import ast
          p=Path('/tmp/hare-big-market')
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('server.py','market.py','static/app.js','static/numbers.js','static/index.html'):
                  item=p/name
                  item.write_bytes(z.read(name))
          server=(p/'server.py').read_text()
          market=(p/'market.py').read_text()
          app=(p/'static/app.js').read_text()
          html=(p/'static/index.html').read_text()
          assert "for field in ('quantity','price')" in server
          assert "quantity×販売価格がデータベースの安全範囲" not in server or "データベースの安全範囲" in server
          assert "request.quantity=quantityText(ui('quantity')).trim()" in app
          assert "quantity:quantityText(buyQuantity).trim()" in app
          assert "request.price=ui('price').value.trim()" in app
          assert "const exactPrice=parseWhole(request.price)" in app
          assert "MAX_MARKET_TOTAL_DIGITS=50000" in app
          assert 'data-ui="price" type="text" inputmode="text"' in html
          assert market.count("price<PRODUCTS[product][2]+1")==2
          assert "99999" not in market.split('def _reserve_shipment',1)[1].split('def settle',1)[0]
          for name in ('server.py','market.py'):
              ast.parse((p/name).read_text())
          print('Frontend and server large-quantity market validations present.')
          PY
          python -m py_compile /tmp/hare-big-market/server.py /tmp/hare-big-market/market.py
          node --check /tmp/hare-big-market/static/app.js
          node --check /tmp/hare-big-market/static/numbers.js
          node - <<'JS'
          global.window={};
          require('/tmp/hare-big-market/static/numbers.js');
          const parse=window.TeruNumber.parseWhole;
          const q=parse('1e4000'),price=parse('1e20');
          if(q===null||price===null||(q*price).toString().length!==4021)throw Error('bad huge product');
          if(parse('2.5e4000')!==25n*10n**3999n)throw Error('bad exponent input');
          if(parse('1e100001')!==null)throw Error('invalid range');
          console.log('Exact e4000, price and product arithmetic passed');
          JS
      - name: Publish verified archive for Render auto deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          if ! git diff --cached --quiet; then
            git commit -m "Fix e4000 large market requests and exact unit prices"
            git push
          fi
