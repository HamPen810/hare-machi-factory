name: Cross-feature V2 transaction ID safety on PostgreSQL 17
on:
  push:
    paths:
      - .github/workflows/test-v2-global-transaction-ids-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: hare_v2_stage_registry_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d hare_v2_stage_registry_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      HARE_V2_LOCAL_STAGING: "yes"
      V2_GLOBAL_STAGE_DSN: postgresql://tester:tester@127.0.0.1:5432/hare_v2_stage_registry_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL driver
        run: pip install 'psycopg[binary]'
      - name: Compile global atomic operation-ID and staging writers
        run: |
          python -m py_compile deployment/v2_global_operation_registry.py deployment/v2_real_schema_staging_actions.py deployment/v2_real_schema_staging_trade.py deployment/test_v2_global_operation_registry.py
      - name: Test same operation ID against 48 concurrent cross-feature calls
        run: |
          cd deployment
          python -m unittest -v test_v2_global_operation_registry
      - name: Verify real production game ZIP did not silently enable staging writers
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('v2_global_operation_registry.py','v2_real_schema_staging_actions.py','v2_real_schema_staging_trade.py'):
                  assert name not in z.namelist()
              print('LIVE_FINANCIAL_WRITERS_NOT_MODIFIED')
          PY
