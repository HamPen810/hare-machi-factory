name: Chromium V2 mobile simulator smoke
on:
  push:
    paths:
      - .github/workflows/test-v2-mobile-browser-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright 1.56 Chromium in CI only
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Serve production ZIP UI on loopback
        run: |
          mkdir -p /tmp/v2-mobile-ui
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          root=Path('/tmp/v2-mobile-ui')
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              for name in ('v2.html','v2.js'):
                  (root/name).write_bytes(z.read('static/'+name))
          PY
          nohup python3 -m http.server 8769 --bind 127.0.0.1 --directory /tmp/v2-mobile-ui >/tmp/v2-http.log 2>&1 &
          sleep 2
      - name: Simulate three screen sizes, authenticated preview and unauthenticated errors
        run: node deployment/test-v2-mobile-browser.cjs
      - name: Retain screenshots on failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-mobile-failure-screenshots
          path: /tmp/v2-ui-*.png
          if-no-files-found: ignore
