name: Full gameplay and admin regression matrix for V2 cutover (bounded timeline)
on:
  push:
    paths:
      - .github/workflows/v2-full-game-regression-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-production-api-and-economy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract the actual deployed game modules into isolated staging folder
        run: |
          mkdir -p /tmp/v2-production
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          root=Path('/tmp/v2-production')
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.py') or name.startswith('static/') or name=='rules-default.txt':
                      p=root/name
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(name))
          PY
      - name: Simulate every major financial and data subsystem without production data
        env:
          PRODUCTION_MODULE_DIR: /tmp/v2-production
          PYTHONPATH: /tmp/v2-production
        run: |
          set -e
          for test in \
            test-admin-funds.py \
            test-admin-debt-bulk.py \
            test-fast-debt-forgiveness.py \
            test-debt-overdraft-clearing.py \
            test-overdraft-admin-collections.py \
            test-multiple-bank-contracts.py \
            test-parallel-bank.py \
            test-tax-accounting.py \
            test-extra-student-slots.py \
            test-paged-timeline.py \
            test-admin-online-chart.py; do
            echo "REGRESSION_START $test"
            python "deployment/$test"
            echo "REGRESSION_PASS $test"
          done
          python deployment/test-html-http-smoke-20261119.py
          echo "ALL_LEGACY_GAME_AND_ADMIN_BACKEND_REGRESSIONS_PASS"
      - name: Install pinned Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Serve actual admin HTML and graph modules in disposable loopback
        run: |
          nohup python3 -m http.server 8768 --bind 127.0.0.1 --directory /tmp/v2-production/static >/tmp/v2-admin-http.log 2>&1 &
          sleep 2
      - name: Simulate administrator console, data graphs, finance forms and mobile navigation
        run: node deployment/test-admin-cockpit-browser.cjs
      - name: Validate exact V2 values and trade concurrency separately
        run: |
          node deployment/test-v2-browser-numbers.cjs
          cd deployment
          python -m unittest -v test_v2_purchase_preview test_v2_balance_read test_sparse_exact_v1 test_sparse_exact_division
