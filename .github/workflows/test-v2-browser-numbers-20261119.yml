name: V2 exact browser numbers regression
on:
  push:
    paths:
      - .github/workflows/test-v2-browser-numbers-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared V2 numeric formatter
        run: node --check deployment/v2-browser-numbers.js
      - name: Test exact rankings, huge exponent labels, and chart magnitudes
        run: node deployment/test-v2-browser-numbers.cjs
