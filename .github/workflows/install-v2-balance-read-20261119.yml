name: Phase 6 V2 authenticated read projection
on:
  push:
    paths:
      - .github/workflows/install-v2-balance-read-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hare-v2-balance-phase6
  cancel-in-progress: false
jobs:
  validate-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run exact-integer migration and V2 read tests
        run: |
          cd deployment
          python -m unittest -v test_v2_balance_read test_v2_numeric_lossless_backfill test_sparse_exact_v1 test_sparse_exact_division
      - name: Apply read-only V2 endpoint to production ZIP
        run: |
          python deployment/install-v2-balance-read-20261119.py
      - name: Verify ZIP Python and browser syntax
        run: |
          mkdir -p /tmp/hare-v2-check /tmp/hare-v2-application
          python - <<'PY'
          import ast
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.py'):
                      ast.parse(z.read(name).decode(), filename=name)
                      Path('/tmp/hare-v2-application',name).write_bytes(z.read(name))
                  if name.startswith('static/'):
                      p=Path('/tmp/hare-v2-application',name)
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(name))
                      if name.endswith('.js'):
                          Path('/tmp/hare-v2-check',Path(name).name).write_bytes(z.read(name))
                  if name=='rules-default.txt':
                      Path('/tmp/hare-v2-application/rules-default.txt').write_bytes(z.read(name))
              server=z.read('server.py').decode()
              assert "if not write and self.path=='/api/v2/balances':" in server
              assert "'/api/v2/balances')" in server
              assert 'v2_numeric_lossless_backfill.py' in z.namelist()
              assert 'action_archive_support.py' in z.namelist()
              assert 'v2_balance_read.py' in z.namelist()
              print('V2_READONLY_SERVER_GUARDS_OK')
          PY
          for f in /tmp/hare-v2-check/*.js; do node --check "$f"; done
      - name: Simulate actual HTML API login and all existing endpoints on isolated SQLite
        run: |
          PYTHONPATH=/tmp/hare-v2-application python deployment/test-html-http-smoke-20261119.py
      - name: Commit only verified production ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          git diff --cached --quiet || { git commit -m "Add authenticated lossless V2 balances read endpoint"; git push; }
