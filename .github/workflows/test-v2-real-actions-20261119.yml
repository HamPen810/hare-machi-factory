name: V2 real game table actions Postgres transaction test (corrected stock fixture)
on:
  push:
    paths:
      - .github/workflows/test-v2-real-actions-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-table-shape-staging-only:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hare_v2_stage_actions_ci
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d hare_v2_stage_actions_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      HARE_V2_LOCAL_STAGING: "yes"
      V2_ACTION_STAGE_DSN: postgresql://tester:tester@127.0.0.1:5432/hare_v2_stage_actions_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PostgreSQL driver
        run: pip install 'psycopg[binary]'
      - name: Compile and test all V2 database actions
        run: |
          python -m py_compile deployment/v2_real_schema_staging_actions.py deployment/test_v2_real_schema_staging_actions.py
          cd deployment
          python -m unittest -v test_v2_real_schema_staging_actions
      - name: Verify module cannot be used on real production database
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              assert 'v2_real_schema_staging_actions.py' not in z.namelist()
              print('NO_LIVE_V2_ACTION_ROUTE_STAGING_ONLY')
          PY
