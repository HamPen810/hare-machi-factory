name: Diagnose live administrator browser actions
on:
  push:
    paths:
      - .github/workflows/diagnose-admin-repair-browser.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install DOM runtime
        run: npm install --no-save jsdom@26
      - name: Exercise actual deployed HTML and JS form submissions
        run: |
          set +e
          mkdir -p /tmp/admin-repair-browser
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('static/admin.html','static/admin.js'):
                  Path('/tmp/admin-repair-browser',name.split('/')[-1]).write_bytes(z.read(name))
          PY
          ADMIN_REPAIR_ASSETS=/tmp/admin-repair-browser node deployment/test-admin-repair-browser.cjs >deployment/repair-browser-diagnostic.txt 2>&1
          echo "TEST_EXIT_CODE:$?" >>deployment/repair-browser-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/repair-browser-diagnostic.txt
          git commit -m "Capture actual admin browser flow diagnostics"
          git push
