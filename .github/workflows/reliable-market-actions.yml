name: Deploy reliable market actions
on:
  push:
    paths:
      - .github/workflows/reliable-market-actions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply validated production reliability patch
        run: |
          python deployment/reliability.py
          mkdir -p /tmp/hare-test
          python -m zipfile -e hare-machi-render.zip /tmp/hare-test
          python -m compileall -q /tmp/hare-test
          node --check /tmp/hare-test/static/app.js
          node --check /tmp/hare-test/static/numbers.js
          node --check /tmp/hare-test/static/admin.js
      - name: Commit tested ZIP and trigger Render deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve reliable market action retries and database wait time"
          git push
