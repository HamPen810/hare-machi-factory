name: V2 purchase preview — test and deploy
on:
  push:
    paths:
      - .github/workflows/install-v2-purchase-preview-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hare-v2-preview
  cancel-in-progress: false
jobs:
  test-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test lossless huge-integer market previews and validation
        run: |
          cd deployment
          python -m unittest -v test_v2_purchase_preview test_v2_balance_read test_sparse_exact_v1 test_sparse_exact_division
      - name: Add authenticated non-binding V2 preview endpoint
        run: python deployment/install-v2-purchase-preview-20261119.py
      - name: Inspect ZIP, Python and browser scripts
        run: |
          mkdir -p /tmp/hare-v2-stage /tmp/hare-v2-js
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import ast
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.py'):
                      ast.parse(z.read(name).decode(),filename=name)
                      Path('/tmp/hare-v2-stage',name).write_bytes(z.read(name))
                  elif name.startswith('static/'):
                      p=Path('/tmp/hare-v2-stage',name)
                      p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_bytes(z.read(name))
                      if name.endswith('.js'):
                          Path('/tmp/hare-v2-js',Path(name).name).write_bytes(z.read(name))
                  elif name=='rules-default.txt':
                      Path('/tmp/hare-v2-stage/rules-default.txt').write_bytes(z.read(name))
              server=z.read('server.py').decode()
              assert "if write and self.path=='/api/v2/preview':" in server
              assert "if not write and self.path=='/api/v2/balances':" in server
              assert "v2_purchase_preview.py" in z.namelist()
              assert "action_archive_support.py" in z.namelist()
              print('V2_PREVIEW_SERVER_GUARDS_VERIFIED')
          PY
          for f in /tmp/hare-v2-js/*.js; do node --check "$f"; done
      - name: Exercise real HTTP registration login preview and game endpoints on temporary SQLite
        run: |
          PYTHONPATH=/tmp/hare-v2-stage python deployment/test-html-http-smoke-20261119.py
      - name: Commit only verified production ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add hare-machi-render.zip
          git diff --cached --quiet || { git commit -m "Add lossless V2 purchase preview API without enabling trading"; git push; }
