name: V2 real-schema settlement concurrency lab
on:
  push:
    paths:
      - .github/workflows/test-v2-real-schema-trade-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-schema-postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hare_v2_stage_trade_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hare_v2_stage_trade_ci"
          --health-interval 3s
          --health-timeout 4s
          --health-retries 20
    env:
      HARE_V2_LOCAL_STAGING: "yes"
      V2_REAL_STAGE_DSN: postgresql://test:test@127.0.0.1:5432/hare_v2_stage_trade_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: pip install 'psycopg[binary]'
      - name: Compile staging settlement and its real-schema integration tests
        run: |
          python -m py_compile deployment/v2_real_schema_staging_trade.py deployment/test_v2_real_schema_staging_trade.py
      - name: Execute V2 simultaneous purchases, giant exact settlement, rollback and ID protection
        run: |
          cd deployment
          python -m unittest -v test_v2_real_schema_staging_trade
      - name: Require production code to remain unmodified
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              assert 'v2_real_schema_staging_trade.py' not in z.namelist()
              print('STAGING_ONLY_ENGINE_NOT_IN_PRODUCTION_ZIP')
          PY
