name: Fix large administrator grant request
on:
  push:
    paths:
      - .github/workflows/fix-admin-funds-large-request.yml
      - deployment/fix-admin-funds-large-request.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand authenticated admin funds request cap
        run: python deployment/fix-admin-funds-large-request.py
      - name: Validate exact e7600 grant and route-specific limits
        run: |
          mkdir -p /tmp/hare-admin-funds-fix
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import ast,json,sys
          if hasattr(sys,'set_int_max_str_digits'):sys.set_int_max_str_digits(0)
          folder=Path('/tmp/hare-admin-funds-fix')
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('server.py','bank.py','static/admin.js','static/numbers.js'):
                  p=folder/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          s=(folder/'server.py').read_text()
          assert "65536 if self.path in ('/api/admin/funds','/api/admin/funds-extra')" in s
          assert "262144 if self.path=='/api/action'" in s
          assert "60000 if self.path=='/api/admin/settings'" in s
          assert "else 4096" in s
          assert "if self.path=='/api/admin/funds':" in s
          ast.parse(s)
          bank=(folder/'bank.py').read_text()
          tree=ast.parse(bank)
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='integer')
          ns={}
          import re
          ns['re']=re
          exec(compile(ast.Module(body=[fn],type_ignores=[]),'<bank-integer-test>','exec'),ns)
          n=ns['integer']('1e7600',1)
          assert n==10**7600
          request=json.dumps(dict(student_id='2711',kind='grant',amount=str(n),
                                  note='',key='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')).encode()
          assert 4096<len(request)<65536
          print(f'e7600 converts exactly to {len(str(n))} digits; POST {len(request)} bytes below new cap')
          PY
          python -m py_compile /tmp/hare-admin-funds-fix/server.py
          node --check /tmp/hare-admin-funds-fix/static/admin.js
          node --check /tmp/hare-admin-funds-fix/static/numbers.js
          node - <<'JS'
          global.window={};
          require('/tmp/hare-admin-funds-fix/static/numbers.js');
          const p=window.TeruNumber.parseWhole('1e7600');
          if (p!==10n**7600n)throw Error('Exact admin number parser did not support 1e7600');
          console.log('Browser exact numeric parsing passed');
          JS
      - name: Publish tested production archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          if ! git diff --cached --quiet; then
            git commit -m "Allow exact administrator grants above the old 4KB body limit"
            git push
          fi
