name: Full V2 multi-operation exact economy reference tests
on:
  push:
    paths:
      - .github/workflows/test-v2-all-operations-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-economic-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm V2 experimental engine is independent of existing production assets
        run: |
          python -m py_compile deployment/v2_game_economy_full_reference.py deployment/test_v2_game_economy_full_reference.py
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              assert 'v2_game_economy_full_reference.py' not in z.namelist()
          print('V2_REFERENCE_IS_STAGING_ONLY')
          PY
      - name: Exercise huge-input shipping purchasing selling price upgrades bank and admin operations
        run: |
          cd deployment
          python -m unittest -v test_v2_game_economy_full_reference
          python -m unittest -v test_v2_purchase_preview test_sparse_exact_v1 test_sparse_exact_division
      - name: Ensure no production assets changed
        run: git diff --exit-code -- hare-machi-render.zip
