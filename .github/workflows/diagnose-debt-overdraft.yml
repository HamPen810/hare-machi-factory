name: Diagnose debt overdraft cancellation patch
on:
  push:
    paths:
      - .github/workflows/diagnose-debt-overdraft.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture patch and test output
        run: |
          set +e
          {
            python deployment/fix-debt-overdraft-clearing.py
            echo "PATCH_EXIT:$?"
            mkdir -p /tmp/clear-debt-diagnostic
            python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('admin_fund_ops.py','admin.py','accounts.py','exact.py','bank.py','market.py','event.py'):
                  Path('/tmp/clear-debt-diagnostic',name).write_bytes(z.read(name))
              Path('/tmp/clear-debt-admin.js').write_bytes(z.read('static/admin.js'))
          PY
            PRODUCTION_MODULE_DIR=/tmp/clear-debt-diagnostic PYTHONPATH=/tmp/clear-debt-diagnostic python deployment/test-debt-overdraft-clearing.py
            echo "DEBT_TEST_EXIT:$?"
            PRODUCTION_MODULE_DIR=/tmp/clear-debt-diagnostic PYTHONPATH=/tmp/clear-debt-diagnostic python deployment/test-admin-debt-bulk.py
            echo "BULK_TEST_EXIT:$?"
            PRODUCTION_MODULE_DIR=/tmp/clear-debt-diagnostic PYTHONPATH=/tmp/clear-debt-diagnostic python deployment/test-extra-student-slots.py
            echo "SLOTS_TEST_EXIT:$?"
            node --check /tmp/clear-debt-admin.js
            echo "JS_EXIT:$?"
          } >deployment/debt-overdraft-diagnostic.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/debt-overdraft-diagnostic.txt
          git diff --cached --quiet || { git commit -m "Record debt overdraft repair diagnostics"; git push; }
