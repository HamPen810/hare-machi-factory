name: V2 read-only ranking, graph source and admin dashboard API regression
on:
  push:
    paths:
      - .github/workflows/install-v2-read-reports-20261119.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hare-v2-exact-report-apis
  cancel-in-progress: false
jobs:
  test-and-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate V2 monetary reports preserve huge integers exactly
        run: |
          cd deployment
          python -m unittest -v test_v2_read_reports test_v2_balance_read test_v2_numeric_lossless_backfill
      - name: Integrate authenticated V2 report APIs into production ZIP
        run: python deployment/install-v2-read-reports-20261119.py
      - name: Validate game and all JavaScript source without touching writer code
        run: |
          mkdir -p /tmp/v2-report-game /tmp/v2-report-js
          python - <<'PY'
          import ast
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              for name in z.namelist():
                  if name.endswith('.py'):
                      ast.parse(z.read(name).decode(),filename=name)
                      Path('/tmp/v2-report-game',name).write_bytes(z.read(name))
                  elif name.startswith('static/'):
                      path=Path('/tmp/v2-report-game',name)
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(z.read(name))
                      if name.endswith('.js'):
                          Path('/tmp/v2-report-js',Path(name).name).write_bytes(z.read(name))
                  elif name=='rules-default.txt':
                      Path('/tmp/v2-report-game/rules-default.txt').write_bytes(z.read(name))
              s=z.read('server.py').decode()
              assert "if not write and self.path=='/api/v2/ranks':" in s
              assert "if not write and self.path=='/api/v2/data':" in s
              assert "if not write and self.path=='/api/admin/v2/dashboard':" in s
              assert 'v2_read_reports.py' in z.namelist()
              print('V2_READ_REPORT_ENDPOINTS_REGISTERED')
          PY
          for file in /tmp/v2-report-js/*.js; do node --check "$file"; done
      - name: Test real anonymous and authenticated API routes on disposable SQLite
        run: PYTHONPATH=/tmp/v2-report-game python deployment/test-html-http-smoke-20261119.py
      - name: Commit only vetted production ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          git diff --cached --quiet || { git commit -m "Expose exact V2 rankings, graph data and admin report read APIs"; git push; }
