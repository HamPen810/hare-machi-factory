name: Audit production archive storage writes (no deploy)
on:
  push:
    branches:
      - diagnostics/storage-growth-20261115
    paths:
      - .github/workflows/storage-growth-diagnostic.yml
      - deployment/reduce-idle-market-ticks.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual production ZIP without modifying it
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          import re
          from hashlib import sha256
          from pathlib import Path
          path=Path("hare-machi-render.zip")
          print("ARCHIVE_BYTES",path.stat().st_size)
          print("ARCHIVE_SHA256",sha256(path.read_bytes()).hexdigest())
          with ZipFile(path) as z:
              invalid=z.testzip()
              if invalid: raise RuntimeError("Invalid archived file "+invalid)
              names=z.namelist()
              print("ARCHIVE_FILES",len(names))
              print("PYTHON_FILES",[n for n in names if n.endswith(".py")][:100])
              patterns=re.compile(r"market_ticks|market_history|\bactions\b|\bdef\s+(act|settle|timeline|history)|idempot|INSERT\s+INTO|ON\s+CONFLICT",re.I)
              blocked=re.compile(r"password|secret|token|api.?key|credential",re.I)
              for filename in ("market.py","accounts.py","postgres.py","server.py","inventory_cluster.py"):
                  if filename not in names:
                      print("MISSING",filename);continue
                  lines=z.read(filename).decode("utf-8").splitlines()
                  hits=[i for i,s in enumerate(lines) if patterns.search(s)]
                  print(f"FILE {filename}: {len(lines)} lines; {len(hits)} matching lines")
                  chosen=set()
                  for i in hits[:85]:
                      chosen.update(range(max(0,i-2),min(len(lines),i+3)))
                  for i in sorted(chosen):
                      s=lines[i]
                      if blocked.search(s): s="[redacted]"
                      print(f"{filename}:{i+1}: {s[:220]}")
              for name,start,end in (("market.py",263,370),("market.py",474,525),("market.py",559,594)):
                  src=z.read(name).decode("utf-8").splitlines()
                  print("CONTEXT",name,start,end)
                  for ln in range(start,end+1):
                      s=src[ln-1]
                      if re.search(r"password|secret|token|api.?key|credential",s,re.I): s="[redacted]"
                      print(f"CONTEXT {name}:{ln}: {s[:250]}")
          print("AUDIT_COMPLETE_NO_WRITES")
          PY

      - name: Apply idle-only optimization to disposable ZIP and validate output
        run: |
          python deployment/reduce-idle-market-ticks.py
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              src=z.read('market.py').decode()
              assert 'No live listings: advance the cursor' in src
              assert 'if rows or not self.accounts.postgres:' in src
              assert 'FROM generate_series' not in src
              assert "SELECT sold FROM market_ticks WHERE player=''" in src
              assert "INSERT INTO market_ticks VALUES" in src
              assert 'UPDATE market_cursor SET last=? WHERE id=1' in src
              compile(src,'market.py','exec')
          print("PATCH_SMOKE_OK")
          PY
          python deployment/reduce-idle-market-ticks.py
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              print("REPEAT_PATCH_OK")
          PY

      - name: Test zero-listing settlement against isolated SQLite fixture
        run: |
          python - <<'PY'
          import ast, sqlite3, types, zipfile
          with zipfile.ZipFile('hare-machi-render.zip') as z:
              src=z.read('market.py').decode()
          module=ast.parse(src)
          game=next(node for node in module.body if isinstance(node,ast.ClassDef) and node.name=='Game')
          method=next(node for node in game.body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name=='settle')
          env={'CLOSE_MS':10**18}
          exec(compile(ast.Module(body=[method],type_ignores=[]),'market.py','exec'),env)
          db=sqlite3.connect(':memory:')
          db.row_factory=sqlite3.Row
          db.executescript('''
            CREATE TABLE market_cursor(id INTEGER PRIMARY KEY,last INTEGER);
            CREATE TABLE listings(id TEXT,round INTEGER);
            CREATE TABLE market_ticks(round INTEGER,product TEXT,player TEXT,sold INTEGER,revenue INTEGER,inventory INTEGER,cost INTEGER);
            INSERT INTO market_cursor VALUES(1,1200);
          ''')
          fake=types.SimpleNamespace(db=db,clock=lambda:1210*60000,accounts=types.SimpleNamespace(postgres=True))
          assert env['settle'](fake,background=True) is False
          assert db.execute('SELECT last FROM market_cursor').fetchone()[0]==1209
          assert db.execute('SELECT COUNT(*) FROM market_ticks').fetchone()[0]==0
          assert env['settle'](fake,background=True) is None
          print('IDLE_MARKET_NO_INSERTS_AND_CURSOR_ADVANCES_OK')
          PY
