name: Set Sunpress tap multiplier to 2x
on:
  push:
    branches: [main]
    paths:
      - deployment/set-sunpress-2x-20261114.py
      - .github/workflows/set-sunpress-2x-20261114.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: game-bundle-update-main
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fail-closed Sunpress multiplier patch
        run: python deployment/set-sunpress-2x-20261114.py
      - name: Verify gameplay calculation and archive integrity
        run: |
          python -m zipfile -t hare-machi-render.zip
          python - <<'PY'
          import ast,zipfile
          with zipfile.ZipFile('hare-machi-render.zip') as z:
              m=z.read('market.py').decode('utf-8')
              tree=ast.parse(m)
              assert "return 2**(r[0] if r else 0)" in m
              assert "f['tap_power']=power(f['tier'])*2**levels.get('sunpress',0)" in m
              assert "cost=EQUIPMENT[kind][1]*5**level" in m
              assert "EQUIPMENT={'sunpress':('おひさまプレス',50000),'islandline':('南風オートライン',250000)}" in m
              assert "return 10**(r[0] if r else 0)" not in m
              assert "f['tap_power']=power(f['tier'])*10**levels.get('sunpress',0)" not in m
              assert 'UPDATE equipment SET level' in m or 'INSERT INTO equipment' in m
              assert 2**0==1 and 2**1==2 and 2**2==4 and 2**10==1024
          print('PASS Sunpress 2x, levels/prices preserved, ZIP valid')
          PY
      - name: Publish to main for Render auto deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          git diff --cached --quiet || { git commit -m "Change Sunpress per-level tap multiplier from 10x to 2x"; git push; }
