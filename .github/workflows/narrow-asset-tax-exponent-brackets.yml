name: Narrow asset-tax exponent brackets after e1000
on:
  push:
    paths:
      - .github/workflows/narrow-asset-tax-exponent-brackets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch production archive only
        run: python deployment/narrow-asset-tax-exponent-brackets.py
      - name: Validate brackets and existing combined-asset behavior
        run: |
          mkdir -p /tmp/hare-tax-brackets
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path('/tmp/hare-tax-brackets/bank.py')
          with ZipFile('hare-machi-render.zip') as z:
              p.write_bytes(z.read('bank.py'))
              html=z.read('static/admin.html').decode()
              assert '1000以上2000未満では5増えるごと' in html
          import ast
          tree=ast.parse(p.read_text())
          target=next(node for node in tree.body if isinstance(node,ast.FunctionDef) and node.name=='asset_exponent_multiplier')
          ns={}
          exec(compile(ast.Module(body=[target],type_ignores=[]),'<isolated-bracket-test>','exec'),ns)
          multiplier=ns['asset_exponent_multiplier']
          def power(n):
              if n<1000:return n//10
              if n<2000:return 100+(n-1000)//5
              return 300+(n-2000)//2
          for n in (0,9,10,99,999,1000,1001,1004,1005,1999,2000,2001,2002,2004,2010,10000):
              assert multiplier(10**n)==10**power(n),n
              assert multiplier(10**n-1)==10**power(n-1 if n else 0),n
          source=p.read_text()
          assert "row['cash'] + row['deposit']" in source
          assert 'FROM stock' in source and 'FROM listings' in source
          assert "PRODUCTS[row['product']][1]" in source
          assert 'asset_exponent_multiplier(value)' in source
          print('Progressive thresholds, continuity and combined assets verified')
          PY
          python -m py_compile /tmp/hare-tax-brackets/bank.py
      - name: Publish production ZIP for Render auto-deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          if ! git diff --cached --quiet; then
            git commit -m "Narrow progressive asset-tax exponent brackets after e1000"
            git push
          fi
