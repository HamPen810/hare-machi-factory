name: Add admin grants and collections safely
on:
  push:
    paths:
      - .github/workflows/deploy-admin-funds.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch existing production ZIP only
        run: python deployment/add-admin-funds.py
      - name: Verify exact financial effects and browser script
        run: |
          mkdir -p /tmp/admin-funds-test
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('admin.py','bank.py','accounts.py','exact.py'):
                  Path('/tmp/admin-funds-test',name).write_bytes(z.read(name))
              Path('/tmp/admin-funds.js').write_bytes(z.read('static/admin.js'))
              html=z.read('static/admin.html').decode('utf-8')
              assert html.count('id="funds-form"')==1
              assert html.count('id="tab-funds"')==1
              assert b"'/api/admin/funds'" in z.read('server.py')
          PY
          PYTHONPATH=/tmp/admin-funds-test python deployment/test-admin-funds.py
          node --check /tmp/admin-funds.js
          python -m compileall -q /tmp/admin-funds-test
      - name: Commit tested ZIP to trigger Render deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          if git diff --cached --quiet; then
            echo "No ZIP changes"
          else
            git commit -m "Add admin cash grants, collections and audited history"
            git push
          fi
