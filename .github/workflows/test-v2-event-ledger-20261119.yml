name: Exact V2 economic ledger and chart source consistency (forgiveness delta regression)
on:
  push:
    paths:
      - .github/workflows/test-v2-event-ledger-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-atomic-ledger-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hare_v2_stage_events_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hare_v2_stage_events_ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      HARE_V2_LOCAL_STAGING: "yes"
      V2_EVENT_STAGE_DSN: postgresql://test:test@127.0.0.1:5432/hare_v2_stage_events_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test driver
        run: pip install 'psycopg[binary]'
      - name: Check all source and test modules
        run: |
          python -m py_compile deployment/v2_global_operation_registry.py deployment/v2_stage_event_ledger.py deployment/v2_real_schema_staging_actions.py deployment/v2_real_schema_staging_trade.py deployment/test_v2_stage_event_ledger.py
      - name: Verify combined V2 market, manufacturing, admin and charts
        run: |
          cd deployment
          python -m unittest -v test_v2_stage_event_ledger
      - name: Ensure no production accounts, SQL or game routing were mutated
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('hare-machi-render.zip') as z:
              assert z.testzip() is None
              for name in ('v2_stage_event_ledger.py','v2_global_operation_registry.py',
                           'v2_real_schema_staging_trade.py','v2_real_schema_staging_actions.py'):
                  assert name not in z.namelist()
              print('V2_STAGING_LEDGER_NOT_ENABLED_FOR_LIVE_ASSETS')
          PY
