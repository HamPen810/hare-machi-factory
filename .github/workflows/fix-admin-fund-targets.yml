name: Fix funds target account selector
on:
  push:
    paths:
      - .github/workflows/fix-admin-fund-targets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch current production deployment
        run: python deployment/fix-admin-fund-targets.py
      - name: Verify selector and financial integrity
        run: |
          mkdir -p /tmp/funds-select-test
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('hare-machi-render.zip') as z:
              for name in ('admin.py','accounts.py','market.py','bank.py','exact.py','event.py'):
                  Path('/tmp/funds-select-test',name).write_bytes(z.read(name))
              ui=z.read('static/admin.js').decode()
              server=z.read('server.py').decode()
              assert "fundsPlayers=result.players||[]" in ui
              assert "const person=fundsPlayers.find(" in ui
              assert "void loadFundsHistory();" in ui
              assert "'players':admin.fund_players()" in server
              assert "fundsPlayers=[];populateFundsTargets()" in ui
              Path('/tmp/funds-select-admin.js').write_text(ui)
          PY
          PYTHONPATH=/tmp/funds-select-test python deployment/test-overdraft-admin-collections.py
          node --check /tmp/funds-select-admin.js
          PYTHONPATH=/tmp/funds-select-test python - <<'PY'
          import sqlite3
          from types import SimpleNamespace
          from exact import setup
          from admin import Admin
          db=sqlite3.connect(':memory:');setup(db)
          db.execute('CREATE TABLE players (id TEXT PRIMARY KEY,student_id TEXT,display_name TEXT)')
          db.execute('CREATE TABLE factories (player TEXT PRIMARY KEY,cash NUMERIC)')
          db.execute("INSERT INTO players VALUES ('p','2101','Player A')")
          db.execute("INSERT INTO factories VALUES('p',1234)")
          admin=Admin(SimpleNamespace(db=db,postgres=False))
          players=admin.fund_players()
          assert players==[{'student_id':'2101','display_name':'Player A','cash':1234}],players
          print('PASS: list player names and balances without loading full dashboard')
          PY
      - name: Deploy only if validation passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hare-machi-render.zip
          git diff --cached --quiet || { git commit -m "Fix admin fund recipient selection independently of dashboard"; git push; }
