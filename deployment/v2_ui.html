<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>V2超巨大数シミュレーター | 晴れ待ちファクトリー</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{max-width:720px;margin:0 auto;padding:18px 14px 56px;background:#121826;color:#edf4ff;line-height:1.6}
h1{font-size:1.45rem;margin:10px 0}
h2{font-size:1.1rem;margin:0 0 12px}
a{color:#9bccff}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:#1d283b;border:1px solid #394962;border-radius:16px;padding:18px;margin:16px 0}
.muted{color:#c5d0de;font-size:.89rem}
.warning{border-left:3px solid #e3b762;padding:8px 12px;background:#303044}
label{display:block;font-weight:650;margin:12px 0 5px}
input,select,button{width:100%;border-radius:9px;font:inherit;padding:10px 12px}
input,select{border:1px solid #7b8ca4;background:#10192a;color:#fff}
button{border:0;background:#93d8b8;color:#091f18;font-weight:750;margin-top:16px}
button:disabled{opacity:.5}
output,.value{display:block;word-break:break-all;overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:.9rem;background:#0e182a;padding:9px;border-radius:7px;white-space:pre-wrap}
.results{display:grid;gap:9px}
.result{margin:0}
.result strong{display:block;font-size:.86rem;color:#c4d8ed;margin-bottom:4px}
.error{color:#ffaaaa;white-space:pre-wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><a href="/">← ゲームに戻る</a><span class="muted">Huge Number V2</span></header>
<h1>超巨大数シミュレーター</h1>
<p class="warning"><strong>試算専用</strong>。ここでは購入・販売・所持金変更を一切行いません。表示される手数料は参考値であり、本番市場の確定価格・税金とは異なります。</p>
<div class="card">
<h2>あなたのV2資産（正確な値）</h2>
<p id="status" class="muted" aria-live="polite">アカウントを確認しています。</p>
<div id="balance" hidden><div class="result"><strong>所持金（S1形式）</strong><output id="cash"></output></div>
<p class="muted">S1は「係数@10の指数」を表す厳密な形式です。例：<code>S1:1@7600</code> = 1e7600</p></div>
<button type="button" id="refresh">資産を再取得</button>
</div>
<div class="card">
<h2>V2購入シミュレーション</h2>
<form id="preview-form">
<label for="product">商品</label>
<select id="product" name="product" required disabled></select>
<label for="quantity">購入数量（指数表記可）</label>
<input id="quantity" name="quantity" required value="1e1000" autocomplete="off" inputmode="text" maxlength="12000">
<label for="unit-price">単価（指数表記可）</label>
<input id="unit-price" name="unit_price" required value="2e1000" autocomplete="off" inputmode="text" maxlength="12000">
<label for="fee">参考手数料率（%）</label>
<input id="fee" name="fee" type="number" min="0" max="100" step="0.01" value="0">
<button type="submit" id="submit" disabled>V2で試算する（取引は実行しない）</button>
</form>
<p id="error" class="error" role="alert" hidden></p>
<div id="results" class="results" hidden aria-live="polite"></div>
</div>
<p class="muted">入力内容と試算結果はこのページでのみ扱います。送信先は同じゲームサーバー内の認証済みV2試算APIです。</p>
<script src="/v2.js" defer></script>
</body></html>
